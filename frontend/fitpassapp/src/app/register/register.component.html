<section class="text-gray-700 bg-white body-font">
  <div class="container mx-auto px-4 py-10 flex justify-center items-center min-h-screen">
    <div class="lg:w-1/3 md:w-1/2 bg-orange-50 bg-opacity-70 rounded-lg shadow-lg p-8 flex flex-col w-full max-w-lg">
      <h2 class="text-orange-600 text-2xl font-semibold mb-6 text-center">Create Your Account</h2>
      <p class="text-gray-700 text-sm mb-6 text-center">Please fill out the form below to register a new account. Make sure to provide accurate information to ensure the best experience.</p>
      <form (ngSubmit)="onRegister()" class="w-full">
        <div class="relative mb-4">
          <label for="email" class="leading-7 text-sm text-gray-700">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email"
                 class="w-full bg-white focus:bg-transparent focus:ring-2 focus:ring-amber-500 rounded border border-gray-300 focus:border-amber-400 text-base outline-none text-gray-700 py-2 px-3 leading-8 transition-colors duration-200 ease-in-out"
                 placeholder="you@example.com">
        </div>
        <div class="relative mb-4">
          <label for="password" class="leading-7 text-sm text-gray-700">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password"
                 class="w-full bg-white focus:bg-transparent focus:ring-2 focus:ring-amber-500 rounded border border-gray-300 focus:border-amber-400 text-base outline-none text-gray-700 py-2 px-3 leading-8 transition-colors duration-200 ease-in-out"
                 placeholder="********">
        </div>
        <div class="relative mb-4">
          <label for="address" class="leading-7 text-sm text-gray-700">Address</label>
          <input type="text" id="address" name="address" [(ngModel)]="address"
                 class="w-full bg-white focus:bg-transparent focus:ring-2 focus:ring-amber-500 rounded border border-gray-300 focus:border-amber-400 text-base outline-none text-gray-700 py-2 px-3 leading-8 transition-colors duration-200 ease-in-out"
                 placeholder="1234 Main St, Apt 101">
        </div>
        <button type="submit" class="w-full text-white bg-orange-600 border-0 py-2 px-6 focus:outline-none hover:bg-orange-700 rounded text-lg mt-4">
          Sign Up
        </button>
      </form>
      <p class="text-gray-700 text-xs mt-4 text-center">
        Already have an account? <a href="/login" class="text-red-600 hover:text-red-700">Log in here</a>.
      </p>
    </div>
  </div>
</section>
