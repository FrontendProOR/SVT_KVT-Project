<div class="container mx-auto p-6 max-w-md">
  <h2 class="text-2xl font-bold text-orange-600 mb-6">Change Password</h2>
  <form (ngSubmit)="submitChangePassword()" #changePasswordForm="ngForm" class="bg-white shadow-md rounded-lg p-6">
    <div class="mb-5">
      <label for="oldPassword" class="block text-gray-700 text-sm font-medium mb-2">Old Password:</label>
      <input type="password" id="oldPassword" [(ngModel)]="oldPassword" name="oldPassword" required 
        class="w-full border-gray-300 border rounded-lg py-3 px-4 text-gray-900 focus:outline-none focus:ring-2 focus:ring-amber-500">
    </div>
    <div class="mb-5">
      <label for="newPassword" class="block text-gray-700 text-sm font-medium mb-2">New Password:</label>
      <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" required 
        class="w-full border-gray-300 border rounded-lg py-3 px-4 text-gray-900 focus:outline-none focus:ring-2 focus:ring-amber-500">
    </div>
    <div class="mb-5">
      <label for="confirmNewPassword" class="block text-gray-700 text-sm font-medium mb-2">Confirm New Password:</label>
      <input type="password" id="confirmNewPassword" [(ngModel)]="confirmNewPassword" name="confirmNewPassword" required 
        class="w-full border-gray-300 border rounded-lg py-3 px-4 text-gray-900 focus:outline-none focus:ring-2 focus:ring-amber-500">
    </div>
    <div *ngIf="errorMessage" class="mb-5 text-red-600 text-sm">
      {{ errorMessage }}
    </div>
    <div class="flex justify-end">
      <button type="submit" 
        class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition duration-200">
        Change Password
      </button>
    </div>
  </form>
</div>
