<div *ngIf="facility" class="container mt-5">
  <div class="card shadow-lg border border-gray-300">
    <div class="card-header bg-amber-600 text-white">
      <h2 class="mb-0">Edit Facility Details: {{ facility.facilityName }}</h2>
    </div>
    <div class="card-body bg-white text-gray-800">
      <form (ngSubmit)="saveFacility()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="facilityName" class="text-gray-700">Facility Name</label>
            <input
              type="text"
              class="form-control bg-gray-100 border-gray-300 focus:bg-white focus:ring-2 focus:ring-amber-500"
              id="facilityName"
              name="facilityName"
              [(ngModel)]="facility.facilityName"
              required
              placeholder="Enter the name of the facility"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label for="city" class="text-gray-700">City</label>
            <input
              type="text"
              class="form-control bg-gray-100 border-gray-300 focus:bg-white focus:ring-2 focus:ring-amber-500"
              id="city"
              name="city"
              [(ngModel)]="facility.city"
              required
              placeholder="Enter the city where the facility is located"
            />
          </div>
        </div>

        <div class="row">
          <div class="col-md-12 mb-3">
            <label for="description" class="text-gray-700">Description</label>
            <textarea
              class="form-control bg-gray-100 border-gray-300 focus:bg-white focus:ring-2 focus:ring-amber-500"
              id="description"
              name="description"
              [(ngModel)]="facility.description"
              rows="4"
              required
              placeholder="Provide a detailed description of the facility"
            ></textarea>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12 mb-3">
            <label for="address" class="text-gray-700">Address</label>
            <input
              type="text"
              class="form-control bg-gray-100 border-gray-300 focus:bg-white focus:ring-2 focus:ring-amber-500"
              id="address"
              name="address"
              [(ngModel)]="facility.address"
              required
              placeholder="Enter the full address of the facility"
            />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="totalRating" class="text-gray-700">Total Rating</label>
            <input
              type="number"
              class="form-control bg-gray-100 border-gray-300 focus:bg-white focus:ring-2 focus:ring-amber-500"
              id="totalRating"
              name="totalRating"
              [(ngModel)]="facility.totalRating"
              placeholder="Enter the total rating (1-10)"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label for="activeStatus" class="text-gray-700">Active Status</label>
            <select
              class="form-control bg-gray-100 border-gray-300 focus:bg-white focus:ring-2 focus:ring-amber-500"
              id="activeStatus"
              name="activeStatus"
              [(ngModel)]="facility.active"
              required
            >
              <option [value]="true">Active</option>
              <option [value]="false">Inactive</option>
            </select>
          </div>
        </div>

        <div class="form-group text-center">
          <button type="submit" class="btn bg-orange-600 text-white hover:bg-orange-700 btn-lg">Save Changes</button>
          <a routerLink="/facility/{{ facility.id }}" class="btn bg-gray-600 text-white hover:bg-gray-700 btn-lg ml-2">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div *ngIf="!facility" class="container mt-5 text-center">
  <p class="lead text-gray-700">Loading facility details... Please wait while we fetch the information.</p>
</div>
