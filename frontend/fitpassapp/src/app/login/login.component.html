<section class="text-gray-700 bg-white body-font min-h-screen flex items-center justify-center">
  <div class="container mx-auto px-4">
    <div class="lg:w-1/3 md:w-1/2 w-full bg-orange-50 bg-opacity-80 rounded-lg p-8 flex flex-col mx-auto">
      <h2 class="text-orange-600 text-2xl font-bold title-font mb-5 text-center">Welcome</h2>
      <p class="text-gray-700 text-base mb-5 text-center">Sign in to your account and continue where you left off. We're excited to have you back!</p>
      
      <form (ngSubmit)="onLogin()" class="w-full">
        <div class="relative mb-4">
          <label for="email" class="leading-7 text-sm text-gray-700">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required
                 class="w-full bg-white focus:bg-transparent focus:ring-2 focus:ring-amber-500 rounded border border-gray-300 focus:border-amber-400 text-base outline-none text-gray-800 py-2 px-4 leading-8 transition-colors duration-200 ease-in-out" placeholder="Enter your email">
        </div>
        <div class="relative mb-4">
          <label for="password" class="leading-7 text-sm text-gray-700">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required
                 class="w-full bg-white focus:bg-transparent focus:ring-2 focus:ring-amber-500 rounded border border-gray-300 focus:border-amber-400 text-base outline-none text-gray-800 py-2 px-4 leading-8 transition-colors duration-200 ease-in-out" placeholder="Enter your password">
        </div>
        <button type="submit" class="w-full text-white bg-orange-600 border-0 py-3 px-8 focus:outline-none hover:bg-orange-700 rounded text-lg transition duration-300 ease-in-out">Sign in</button>
      </form>
      
      <p class="text-gray-700 text-base mt-5 text-center">
        Don't have an account? <a href="register" class="text-red-600 hover:underline" routerLink="register">Sign up now</a>.
      </p>
    </div>
  </div>
</section>
